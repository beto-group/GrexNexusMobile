<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Grex Component</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #090d16; width: 100%; height: 100%; overflow: hidden; color: #fff; font-family: sans-serif; }
    #grex-root { width: 100%; height: 100vh; overflow-y: auto; }
    .boot-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; gap: 16px; color: rgba(255,255,255,0.4); font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="grex-root">
    <div class="boot-screen">
      <div style="width:40px;height:40px;border:2px solid #a855f7;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      <span>Loading component...</span>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  </div>
  <script type="module">
    const platformAPI = {
      isStandalone: true,
      componentId: 'GrexComponent',
      componentLabel: 'Grex Component',
      host: 'android-child'
    };
    try {
      let moduleToMount;
      const cachedJs = localStorage.getItem('grex_hot_bundle_GrexComponent');
      if (cachedJs && cachedJs.length > 100) {
        console.log('[GrexChildShell] Booting dynamically from hot-bundle cache...');
        const blob = new Blob([cachedJs], { type: 'application/javascript' });
        const blobUrl = URL.createObjectURL(blob);
        moduleToMount = await import(blobUrl);
      } else {
        moduleToMount = await import('./bundle.es.js');
      }
      const mountFn = moduleToMount.mount_app || (moduleToMount.default && moduleToMount.default.mount_app);
      if (typeof mountFn === 'function') {
        await mountFn(document.getElementById('grex-root'), platformAPI);
      } else {
        throw new Error('Bundle does not export a mount_app function.');
      }
    } catch (err) {
      console.error('[GrexChildShell] Boot error:', err);
      document.getElementById('grex-root').innerHTML =
        '<div style="color:#ef4444;padding:24px;font-family:monospace;font-size:12px;">' +
        '<strong>[GrexChildShell] mount_app error:</strong><br>' + err.message + '</div>';
    }
  </script>
</body>
</html>
